name: VI Dubber checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vi-dubber-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: 0.8.22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: uv sync --locked --dev
      - run: uv run pytest tests/test_core.py tests/test_artifacts.py -q
      - name: Guard against CC-BY-NC diffq/demucs imports in src/vi_dubber
        run: |
          uv run python - <<'PY'
          import ast, pathlib, sys
          banned = {'diffq', 'diffq_fixed', 'demucs'}
          hits = []
          for f in pathlib.Path('src/vi_dubber').rglob('*.py'):
              tree = ast.parse(f.read_text(encoding='utf-8'), filename=str(f))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          root = alias.name.split('.')[0]
                          if root in banned:
                              hits.append(f'{f}:{node.lineno}: import {alias.name}')
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      root = node.module.split('.')[0]
                      if root in banned:
                          hits.append(f'{f}:{node.lineno}: from {node.module} import ...')
          if hits:
              print('BLOCKED CC-BY-NC IMPORTS:', hits, file=sys.stderr)
              sys.exit(1)
          print('LICENSE_GUARD_PASS: 0 diffq/demucs imports in src/vi_dubber')
          PY
