# Standalone-first local pre-commit hooks for Naqex VI Dubber.
# Uses uvx ruff (without modifying pyproject.toml/uv.lock) and uv-managed pytest.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uvx ruff check --isolated --select E4,E7,E9,F
        language: system
        types: [python]
        files: ^(src|tests|scripts)/
      - id: pytest-contracts
        name: pytest (offline contracts)
        entry: uv run --locked pytest tests/test_core.py tests/test_artifacts.py -q
        language: system
        pass_filenames: false
        always_run: true
